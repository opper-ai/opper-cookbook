<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opper Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Wix Madefor Display"', 'system-ui', 'sans-serif'] },
        }
      }
    }
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      document.documentElement.classList.toggle('dark', e.matches);
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(1 0 0);
      --fg: oklch(0.2938 0.0414 248.11);
      --card: oklch(1 0 0);
      --card-fg: oklch(0.145 0 0);
      --primary: oklch(0.205 0 0);
      --primary-fg: oklch(0.985 0 0);
      --secondary: oklch(0.97 0 0);
      --secondary-fg: oklch(0.205 0 0);
      --muted: oklch(0.97 0 0);
      --muted-fg: oklch(0.45 0 0);
      --accent: oklch(0.98 0 0);
      --accent-fg: oklch(0.40 0 0);
      --border: oklch(0.922 0 0);
      --input: oklch(0.922 0 0);
      --ring: oklch(0.708 0 0);
    }
    .dark {
      --bg: oklch(0.252 0 102.07);
      --fg: oklch(0.9881 0 102.07);
      --card: oklch(0.23 0 0);
      --card-fg: oklch(0.9881 0 102.07);
      --primary: oklch(0.9881 0 102.07);
      --primary-fg: oklch(0.252 0 102.07);
      --secondary: oklch(0.30 0 0);
      --secondary-fg: oklch(0.9881 0 102.07);
      --muted: oklch(0.30 0 0);
      --muted-fg: oklch(0.72 0 0);
      --accent: oklch(0.35 0 0);
      --accent-fg: oklch(0.90 0 0);
      --border: oklch(0.35 0 0);
      --input: oklch(0.35 0 0);
      --ring: oklch(0.556 0 0);
    }

    body { background: var(--bg); color: var(--fg); }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message-enter { animation: messageIn 0.3s ease-out; }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .thinking-dots span { animation: dot 1.4s ease-in-out infinite; opacity: 0.2; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    .media-card { animation: glowIn 0.5s ease-out; }
    @keyframes glowIn {
      from { opacity: 0; box-shadow: 0 0 16px var(--ring); }
      to { opacity: 1; box-shadow: none; }
    }
  </style>
</head>
<body class="h-screen flex font-sans">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 flex-shrink-0 flex flex-col border-r h-screen" style="border-color:var(--border);background:var(--card)">
    <div class="px-4 py-4 flex items-center justify-between flex-shrink-0">
      <h2 class="text-xs font-semibold uppercase tracking-wider" style="color:var(--muted-fg)">History</h2>
      <button onclick="startNewChat()" class="p-1.5 rounded-lg hover:opacity-70 transition-opacity" style="background:var(--primary);color:var(--primary-fg)" title="New chat">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>
    <div id="historyList" class="flex-1 overflow-y-auto sidebar px-2 pb-4 space-y-1"></div>
  </aside>

  <!-- Main chat -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Header -->
    <header class="border-b px-6 py-4 flex items-center gap-3 flex-shrink-0" style="border-color:var(--border)">
      <div class="w-8 h-8 rounded-[10px] flex items-center justify-center" style="background:var(--primary)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--primary-fg)">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-sm font-semibold" style="color:var(--fg)">Opper Chatbot</h1>
        <p class="text-xs" style="color:var(--muted-fg)">OpenResponses API &middot; Web Search &middot; Image Generation &middot; Text-to-Speech</p>
      </div>
    </header>

    <!-- Chat area -->
    <main class="flex-1 overflow-y-auto chat-messages min-h-0" id="chatArea">
      <div class="max-w-2xl mx-auto px-4 py-6 space-y-4" id="messages"></div>
    </main>

    <!-- Input area -->
    <footer class="border-t px-4 py-4 flex-shrink-0" style="border-color:var(--border)">
      <form id="chatForm" class="max-w-2xl mx-auto flex gap-3 items-end">
        <textarea
          id="input"
          placeholder="Ask me anything, search the web, generate images..."
          rows="1"
          class="flex-1 rounded-[10px] px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 transition-colors"
          style="max-height:120px;background:var(--input);border:1px solid var(--border);color:var(--fg);--tw-ring-color:var(--ring);"
        ></textarea>
        <button
          type="submit"
          id="sendBtn"
          class="rounded-[10px] px-4 py-3 text-sm font-medium transition-opacity hover:opacity-80 disabled:opacity-30 flex-shrink-0"
          style="background:var(--primary);color:var(--primary-fg);"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const chatArea = document.getElementById("chatArea");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const historyList = document.getElementById("historyList");

    // ── Conversation state ──────────────────────────────────────────────────
    let history = [];
    let sessionId = null;
    let currentChatId = null;

    // ── localStorage persistence ────────────────────────────────────────────
    function loadAllChats() {
      return JSON.parse(localStorage.getItem("opper-chats") || "[]");
    }
    function saveAllChats(chats) {
      localStorage.setItem("opper-chats", JSON.stringify(chats));
    }
    function saveCurrentChat() {
      if (!currentChatId || history.length === 0) return;
      const chats = loadAllChats();
      const idx = chats.findIndex(c => c.id === currentChatId);
      const title = history.find(m => m.role === "user")?.content.slice(0, 50) || "New chat";
      const chat = { id: currentChatId, title, messages: history, sessionId, updatedAt: Date.now() };
      if (idx >= 0) chats[idx] = chat; else chats.unshift(chat);
      saveAllChats(chats);
      renderHistory();
    }
    function deleteChat(id) {
      const chats = loadAllChats().filter(c => c.id !== id);
      saveAllChats(chats);
      if (currentChatId === id) startNewChat();
      else renderHistory();
    }

    // ── History sidebar ─────────────────────────────────────────────────────
    function renderHistory() {
      const chats = loadAllChats();
      historyList.innerHTML = "";
      for (const chat of chats) {
        const el = document.createElement("div");
        const isActive = chat.id === currentChatId;
        el.className = "group flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer text-xs transition-colors";
        el.style.background = isActive ? "var(--accent)" : "transparent";
        el.style.color = isActive ? "var(--fg)" : "var(--muted-fg)";
        el.onmouseenter = () => { if (!isActive) el.style.background = "var(--secondary)"; };
        el.onmouseleave = () => { if (!isActive) el.style.background = "transparent"; };
        el.innerHTML = `
          <span class="flex-1 truncate">${escapeHtml(chat.title)}</span>
          <button onclick="event.stopPropagation();deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-60 hover:!opacity-100 p-0.5 transition-opacity" title="Delete">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        `;
        el.onclick = () => loadChat(chat.id);
        historyList.appendChild(el);
      }
    }

    function loadChat(id) {
      const chats = loadAllChats();
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      currentChatId = chat.id;
      sessionId = chat.sessionId;
      history = [...chat.messages];
      messagesEl.innerHTML = "";
      addWelcome();
      for (const msg of history) {
        if (msg.role === "user") addUserMessage(msg.content, false);
        else addAssistantMessage(msg.content, msg.media || [], false);
      }
      renderHistory();
      scrollToBottom();
    }

    // ── New chat ────────────────────────────────────────────────────────────
    async function startNewChat() {
      currentChatId = crypto.randomUUID();
      history = [];
      sessionId = null;
      messagesEl.innerHTML = "";
      addWelcome();
      renderHistory();
      try {
        const res = await fetch("/api/session", { method: "POST" });
        const data = await res.json();
        sessionId = data.sessionId;
      } catch {}
      input.focus();
    }

    function addWelcome() {
      const el = document.createElement("div");
      el.className = "message-enter flex gap-3";
      el.innerHTML = `
        <div class="w-7 h-7 rounded-full flex-shrink-0 mt-0.5 flex items-center justify-center" style="background:var(--primary)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--primary-fg)">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="rounded-[10px] rounded-tl-sm px-4 py-3 max-w-[85%]" style="background:var(--secondary)">
          <p class="text-sm leading-relaxed" style="color:var(--accent-fg)">
            Hey! I'm a chatbot powered by Opper's <strong style="color:var(--fg)">OpenResponses</strong> endpoint. I can search the web, generate images, and read text aloud. Try it out!
          </p>
        </div>
      `;
      messagesEl.appendChild(el);
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function scrollToBottom() {
      requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
    }
    function escapeHtml(text) {
      const el = document.createElement("div");
      el.textContent = text;
      return el.innerHTML;
    }
    function renderMarkdown(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`(.+?)`/g, '<code style="background:var(--muted);padding:2px 6px;border-radius:4px;font-size:0.75rem;font-family:monospace;">$1</code>')
        .replace(/\n/g, "<br>");
    }

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    // ── Message rendering ───────────────────────────────────────────────────
    function addUserMessage(text, animate = true) {
      const el = document.createElement("div");
      el.className = `${animate ? "message-enter " : ""}flex gap-3 justify-end`;
      el.innerHTML = `
        <div style="background:var(--accent);color:var(--accent-fg);" class="rounded-[10px] rounded-tr-sm px-4 py-3 max-w-[85%]">
          <p class="text-sm leading-relaxed">${escapeHtml(text)}</p>
        </div>
      `;
      messagesEl.appendChild(el);
      if (animate) scrollToBottom();
    }

    function addThinking() {
      const el = document.createElement("div");
      el.id = "thinking";
      el.className = "message-enter flex gap-3";
      el.innerHTML = `
        <div class="w-7 h-7 rounded-full flex-shrink-0 mt-0.5 flex items-center justify-center" style="background:var(--primary)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--primary-fg)">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="rounded-[10px] rounded-tl-sm px-4 py-3" style="background:var(--secondary)">
          <div class="thinking-dots text-sm" style="color:var(--muted-fg)">
            <span>&#9679;</span> <span>&#9679;</span> <span>&#9679;</span>
          </div>
        </div>
      `;
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function removeThinking() {
      const el = document.getElementById("thinking");
      if (el) el.remove();
    }

    function addAssistantMessage(text, mediaItems, animate = true) {
      const el = document.createElement("div");
      el.className = `${animate ? "message-enter " : ""}flex gap-3`;

      let mediaHtml = "";
      for (const m of mediaItems || []) {
        if (m.type === "image") {
          mediaHtml += `
            <div class="media-card mt-3 rounded-[10px] overflow-hidden relative group cursor-pointer" style="border:1px solid var(--border)" onclick="window.open('${m.url}','_blank')">
              <img src="${m.url}" alt="Generated image" class="w-full" loading="lazy" />
              <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-colors flex items-center justify-center">
                <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                  <a href="${m.url}" download class="bg-white/90 hover:bg-white rounded-lg px-3 py-1.5 text-xs font-medium flex items-center gap-1.5" style="color:var(--card-fg)" onclick="event.stopPropagation()">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Download
                  </a>
                  <span class="bg-white/90 rounded-lg px-3 py-1.5 text-xs font-medium flex items-center gap-1.5" style="color:var(--card-fg)">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    Open
                  </span>
                </div>
              </div>
            </div>
          `;
        } else if (m.type === "audio") {
          mediaHtml += `
            <div class="media-card mt-3 flex items-center gap-3 rounded-[10px] px-4 py-3" style="background:var(--secondary);border:1px solid var(--border)">
              <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--muted-fg)">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M9 9v6l-3-3H3v-6h3l3-3z"/>
              </svg>
              <audio controls src="${m.url}" class="flex-1 h-8"></audio>
            </div>
          `;
        }
      }

      el.innerHTML = `
        <div class="w-7 h-7 rounded-full flex-shrink-0 mt-0.5 flex items-center justify-center" style="background:var(--primary)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--primary-fg)">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="max-w-[85%]">
          <div class="rounded-[10px] rounded-tl-sm px-4 py-3" style="background:var(--secondary)">
            <p class="text-sm leading-relaxed" style="color:var(--accent-fg)">${renderMarkdown(text)}</p>
          </div>
          ${mediaHtml}
        </div>
      `;
      messagesEl.appendChild(el);
      if (animate) scrollToBottom();
    }

    // ── Send message ────────────────────────────────────────────────────────
    async function sendMessage(text) {
      if (!text.trim()) return;

      addUserMessage(text);
      history.push({ role: "user", content: text });
      saveCurrentChat();

      input.value = "";
      input.style.height = "auto";
      input.disabled = true;
      sendBtn.disabled = true;
      addThinking();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, sessionId }),
        });

        removeThinking();

        if (!res.ok) {
          const err = await res.json();
          addAssistantMessage("Something went wrong: " + (err.error || "Unknown error"), []);
          return;
        }

        const data = await res.json();
        addAssistantMessage(data.text, data.media || []);
        history.push({ role: "assistant", content: data.text, media: data.media || [] });
        saveCurrentChat();
      } catch (err) {
        removeThinking();
        addAssistantMessage("Connection error. Is the server running?", []);
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    // ── Init ────────────────────────────────────────────────────────────────
    startNewChat();
  </script>
</body>
</html>
